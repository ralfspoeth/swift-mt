# xldr logs through System.Logger, which binds to java.util.logging, and JUL's
# default console handler is INFO. The reason a feed does not come up is logged
# below that: FeedRegistry#deactivate says "not a feed: <dir> - cannot read
# mapping spec: ..." at DEBUG, because a directory that is not a feed is an
# ordinary thing to find under a root. During a failing integration test it is
# the one line worth having.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n

io.github.ralfspoeth.xldr.level = ALL
