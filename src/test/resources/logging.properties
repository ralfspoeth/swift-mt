# xldr logs through System.Logger, which binds to java.util.logging.
#
# INFO rather than ALL, because what made a green run shout was DEBUG and not
# the level below it. FeedRegistry#deactivate says "not a feed: <dir>" for every
# directory under a root that is not one, on every scan, and the scan interval
# here is a second against a wait of twenty - so the useful lines arrive buried
# in hundreds of identical ones. INFO drops all of that and keeps the four the
# server logs once each, which between them narrate the test: what it is
# watching, the feed coming up, the row count, the feed going away.
#
# WARNING would be quieter still and is not worth it: the line it would drop,
# "loaded N row(s) from ...", is the one confirmation that the thing under test
# happened at all.
#
# Turn this up when a feed will not come up. FeedRegistry#deactivate says
# "not a feed: <dir> - cannot read mapping spec: ..." at DEBUG, because a
# directory that is not a feed is an ordinary thing to find under a root, and
# that line is then the one worth having. ALL reaches it; the handler below is
# already open wide, so this is the only level to change.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n

io.github.ralfspoeth.xldr.level = INFO
